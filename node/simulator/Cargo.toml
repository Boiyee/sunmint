[package]
name = "sunmint-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.5.0", features = ["signer-local", "sol-types"] }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sunmint-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["full"] }
